name: CONTROLE+ Build

on:
  push:
    branches:
      - controle-plus-v1
      - controle-plus-business-v2
      - controle-plus-blue-app-v3
      - controle-plus-listing-v4
      - controle-plus-speed-ui-v7
      - controle-plus-admin-photos-v8
      - controle-plus-didactic-home-v9
      - controle-plus-polish-pwa-v10
      - controle-plus-trial-v11
      - controle-plus-guia-brique-v12
      - controle-plus-vendas-hoje-v13
      - controle-plus-trial-modal-v14
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

# v14 retry
