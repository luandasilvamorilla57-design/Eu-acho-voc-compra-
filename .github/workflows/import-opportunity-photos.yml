name: Importar fotos oficiais das oportunidades
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-opportunity-photos.yml]
permissions:
  contents: write
jobs:
  import:
    if: "github.event.head_commit.message == 'chore: stage opportunity product photos'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publicar quatro fotos mantendo associação
        run: |
          set -euo pipefail
          mkdir -p public/opportunities
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3440e784-9feb-4e4b-a51d-09961e9e8f1c.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2YxZjU1ZmU2MzYyYmNlNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjIwODYzOH0.IEXvvKOO4byiwc97G6JdtdHwIgBhng8wPZv3Sn-jmxQ" -o public/opportunities/01-parafusadeira.jpg
          echo "ab29d6c9b4fa1c4350dc33f0eea2606407a06a3c1eaf8927f4445afa2b99bb9e  public/opportunities/01-parafusadeira.jpg" | sha256sum -c -
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f326e9ca-4c15-4517-b8a4-e027463a5790.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2VjM2I4NjNkYTM1Mjk0YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjI1NDgxOX0.SnQ5zECK5pqSNxDmaW7KVc759JPee6LNqPiPQz0seEc" -o public/opportunities/02-soquetes.jpg
          echo "f7372932759fe5bf1343fe32940198071afbf35b871d38c56b088678d7dec0ca  public/opportunities/02-soquetes.jpg" | sha256sum -c -
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b76d8961-1e21-449d-93df-4de1f0c9d546.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTM0ZDlmZmJhY2JjYjdkNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjIyMjMzMX0.YgXHM1J_q564s26yjvfvnv00CxwypTTjM_hF6xUVWX4" -o public/opportunities/03-cabos-iphone.jpg
          echo "9e2fc52e5384d5845ef10578a5fb561d80ee729d8422c045bd8a355220cb1233  public/opportunities/03-cabos-iphone.jpg" | sha256sum -c -
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error "https://d2jqrm6oza8nb6.cloudfront.net/datasets/16f266e0-db3a-4154-9a89-30ba103fe4c9.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTMzMDhkMWRkNmViMTY2ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjIyOTQwNX0.AUTU2G-0TS8FkjU1r1DQjWjOPNvKFBz7pbvqe062EVY" -o public/opportunities/04-panelas.jpg
          echo "78445d4b05d3f6b4690b7720067dc29dc1a41e088d008069fd049a7e783f1e24  public/opportunities/04-panelas.jpg" | sha256sum -c -
          git config user.name "CONTROLE+ automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/opportunities/
          git commit -m "feat(assets): add four official recommendation product photos"
          git push origin HEAD:main
