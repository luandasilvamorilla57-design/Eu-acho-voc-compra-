name: One-time global mobile modal centering patch

# Triggered after creation so GitHub executes it from the default branch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-center-mobile-modals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center standard modals on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('src/control/control-home-refinement.css')
          s=p.read_text()
          marker='/* Estoque: o seletor específico de adicionar produto deve flutuar no centro,'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+'\n\n'
          encoded=''
          s += base64.b64decode(encoded).decode()
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-center-mobile-modals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: center all standard mobile modals"
          git push
