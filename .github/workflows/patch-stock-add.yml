name: One-time stock add UX patch

# Triggered intentionally after creation so GitHub can execute the workflow from the default branch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stock-add.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stock add flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/control/ControlApp.tsx')
          s=p.read_text()

          old="type Modal='actions'|'purchase'|'inventory'|'sale'|'expense'|'cash'|'settings'|'listingCheckin'|null"
          new="type Modal='actions'|'stockAdd'|'purchase'|'inventory'|'sale'|'expense'|'cash'|'settings'|'listingCheckin'|null"
          assert old in s, 'Modal type anchor not found'
          s=s.replace(old,new,1)

          old="{view==='stock'&&<StockPage data={data} calc={calc} onOpenProduct={setSelected} onAdd={()=>openModal('actions')}/>}"
          new="{view==='stock'&&<StockPage data={data} calc={calc} onOpenProduct={setSelected} onAdd={()=>openModal('stockAdd')}/>}"
          assert old in s, 'StockPage wiring anchor not found'
          s=s.replace(old,new,1)

          old="    {modal==='actions'&&<ActionSheet onClose={()=>setModal(null)} onChoose={openModal}/>}\n"
          new="    {modal==='actions'&&<ActionSheet onClose={()=>setModal(null)} onChoose={openModal}/>}\n    {modal==='stockAdd'&&<StockAddSheet data={data} onClose={()=>setModal(null)} onOwn={()=>setModal('inventory')} onRegisterPurchase={()=>setModal('purchase')} onOpenPurchased={product=>{setModal(null);setSelected(product)}}/>}\n"
          assert old in s, 'Modal render anchor not found'
          s=s.replace(old,new,1)

          marker="function ActionSheet({onClose,onChoose}:{onClose:()=>void;onChoose:(m:Modal)=>void}){"
          component=r'''function StockAddSheet({data,onClose,onOwn,onRegisterPurchase,onOpenPurchased}:{data:Data;onClose:()=>void;onOwn:()=>void;onRegisterPurchase:()=>void;onOpenPurchased:(product:Product)=>void}){
  const purchased=data.products.filter(product=>product.acquisition_type==='purchase')
  return <ModalShell onClose={onClose} compact><div className="cp-action-sheet cp-stock-add-sheet">
    <span className="cp-eyebrow">ADICIONAR AO ESTOQUE</span>
    <h2>De onde vem esse produto?</h2>
    <p>Evite cadastrar duas vezes. Compras registradas no CONTROLE+ já entram no estoque automaticamente.</p>
    <Action icon={<Box/>} title="Produto que já tenho" text="Algo que já era seu · não mexe no caixa" onClick={onOwn}/>
    <Action icon={<ShoppingBag/>} title="Ainda não registrei a compra" text="Registra a compra, desconta do caixa e coloca no estoque" onClick={onRegisterPurchase}/>
    {purchased.length>0&&<div className="cp-stock-existing">
      <div className="cp-stock-existing-head"><span>COMPRAS JÁ CADASTRADAS</span><small>Esses produtos já fazem parte do estoque/histórico.</small></div>
      <div className="cp-stock-existing-list">{purchased.slice(0,8).map(product=><button type="button" key={product.id} onClick={()=>onOpenPurchased(product)}>
        <span><Package/></span><div><b>{product.name}</b><small>{product.quantity_available>0?product.quantity_available+' un. disponível(is)':'Sem unidades disponíveis · ver histórico'}</small></div><ChevronRight/>
      </button>)}</div>
    </div>}
  </div></ModalShell>
}

'''
          assert marker in s, 'ActionSheet anchor not found'
          s=s.replace(marker,component+marker,1)

          s=s.replace('Depois, assine por R$ 12,90/mês se quiser continuar registrando compras e vendas.','Depois, assine por R$ 18,90/mês se quiser continuar registrando compras e vendas.')

          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-stock-add.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make stock add flow inventory-specific"
          git push
