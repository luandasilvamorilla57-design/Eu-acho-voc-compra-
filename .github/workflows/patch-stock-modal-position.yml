name: One-time stock modal position patch

# Triggered after creation so GitHub executes it from main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stock-modal-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append centered stock modal CSS
        shell: bash
        run: |
          echo '' | base64 -d >> src/control/control-home-refinement.css
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/patch-stock-modal-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: center stock add modal on mobile"
          git push
