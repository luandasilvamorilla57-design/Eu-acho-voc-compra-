<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07111f"/>
  <meta name="description" content="CONTROLE+ — estoque, vendas, caixa e lucro para quem compra e revende."/>
  <script>
    (function(){
      try{
        var saved=localStorage.getItem('controle-plus-theme');
        var theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
        document.documentElement.dataset.theme=theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='light'?'#f3f7fc':'#07111f');
      }catch(e){}
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest?v=11"/>
  <link rel="icon" href="/control-plus-icon.svg?v=2" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/control-plus-icon.svg?v=2"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta property="og:title" content="CONTROLE+"/>
  <meta property="og:description" content="Seu estoque, suas vendas e seu caixa sob controle."/>
  <title>CONTROLE+</title>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
